name: Mayor FB Monitor

on:
  schedule:
    # Runs at 12:00 AM Midnight & 6:00 AM PHT, Monday through Saturday
    - cron: '0 16,22 * * 0-5'
  workflow_dispatch:

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run FB Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BELLRINGER_MANILA_BOT }}
          TELEGRAM_CHAT_ID: ${{ secrets.BELLRINGER_MANILA_BOT_CHANNEL_ID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python fb_scraper.py

      - name: Commit state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_posts.txt || true
          git commit -m "Update state" || true
          git push || true
